version: "3.9"

services:
  agentops-api:
    build: .
    container_name: agentops-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Redis for caching (future)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"